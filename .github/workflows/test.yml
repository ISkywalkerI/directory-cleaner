name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, ubuntu-24.04]
        go: ['1.25.12']
        include:
          - os: ubuntu-22.04
            go: '1.21.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Ubuntu tests and race detector
        if: runner.os == 'Linux'
        run: bash scripts/test.sh
      - name: Keep test reports (including skips)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.os }}-go${{ matrix.go }}
          path: |
            artifacts/*.jsonl
            artifacts/coverage.out
          if-no-files-found: warn
          retention-days: 14

  cross-build:
    name: Build only (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
      - name: Cross compile (no runtime verification)
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p artifacts
          go mod download
          go mod verify
          suffix=''; [[ "$GOOS" != windows ]] || suffix='.exe'
          go build -o "artifacts/dircleaner-$GOOS-$GOARCH$suffix" ./cmd/dircleaner

  ci:
    name: CI
    if: always()
    needs: [native, cross-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every matrix job
        env:
          NATIVE: ${{ needs.native.result }}
          CROSS_BUILD: ${{ needs.cross-build.result }}
        run: test "$NATIVE" = success && test "$CROSS_BUILD" = success
