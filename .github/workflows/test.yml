name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, ubuntu-24.04]
        go: ['1.25.12']
        include:
          - os: ubuntu-22.04
            go: '1.21.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Ubuntu tests and race detector
        if: runner.os == 'Linux'
        run: bash scripts/test.sh
      - name: Build and verify release packages
        if: matrix.go == '1.25.12'
        shell: pwsh
        run: |
          ./scripts/build.ps1 | Set-Content artifacts/release-path.txt
          if (-not $?) { throw 'Release build failed' }
          ./scripts/test-release.ps1 -ReleaseDirectory (Get-Content artifacts/release-path.txt)
      - name: Keep release packages
        if: matrix.go == '1.25.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: |
            artifacts/releases/*/*.zip
            artifacts/releases/*/*.tar.gz
            artifacts/releases/*/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Windows NSSM service acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path (Get-Content artifacts/release-path.txt) 'windows-amd64/directory-cleaner'
          ./scripts/test-nssm.ps1 -Nssm "$root/tools/nssm.exe" -Exe "$root/dircleaner.exe"
      - name: Ubuntu systemd service acceptance
        if: runner.os == 'Linux' && matrix.go == '1.25.12'
        run: sudo bash scripts/test-systemd.sh "$(cat artifacts/release-path.txt)/linux-amd64/directory-cleaner/dircleaner"
      - name: Keep test reports (including skips)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.os }}-go${{ matrix.go }}
          path: |
            artifacts/*.jsonl
            artifacts/coverage.out
            artifacts/nssm/
            artifacts/systemd/
          if-no-files-found: warn
          retention-days: 14

  cross-build:
    name: Build only (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
      - name: Cross compile (no runtime verification)
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p artifacts
          go mod download
          go mod verify
          suffix=''; [[ "$GOOS" != windows ]] || suffix='.exe'
          go build -o "artifacts/dircleaner-$GOOS-$GOARCH$suffix" ./cmd/dircleaner

  ci:
    name: CI
    if: always()
    needs: [native, cross-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every matrix job
        env:
          NATIVE: ${{ needs.native.result }}
          CROSS_BUILD: ${{ needs.cross-build.result }}
        run: test "$NATIVE" = success && test "$CROSS_BUILD" = success

  release:
    name: Publish tagged release
    needs: [ci]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish packages from this tested run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name release-windows-2022 --dir assets
          cd "$(dirname "$(find assets -name SHA256SUMS -print -quit)")"
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft ./*.zip ./*.tar.gz SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
