name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, ubuntu-24.04]
        go: ['1.25.12']
        include:
          - os: ubuntu-22.04
            go: '1.21.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Ubuntu tests and race detector
        if: runner.os == 'Linux'
        run: bash scripts/test.sh
      - name: Windows NSSM service acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/tools | Out-Null
          # Fixed Chocolatey package embeds the upstream NSSM archive; verify its published SHA256.
          Invoke-WebRequest 'https://community.chocolatey.org/api/v2/package/nssm/2.24.101.20180116' -OutFile artifacts/tools/package.zip
          Expand-Archive artifacts/tools/package.zip artifacts/tools/package
          $archive = Get-Item artifacts/tools/package/tools/nssm-2.24-101-g897c7ad.zip
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '99F5045FFFBFFB745D67FE3A065A953C4A3D9C253B868892D9B685B0EE7D07B8') { throw 'NSSM checksum mismatch' }
          Expand-Archive $archive artifacts/tools/nssm
          ./scripts/test-nssm.ps1 -Nssm artifacts/tools/nssm/nssm-2.24-101-g897c7ad/win64/nssm.exe
      - name: Ubuntu systemd service acceptance
        if: runner.os == 'Linux' && matrix.go == '1.25.12'
        run: sudo bash scripts/test-systemd.sh
      - name: Keep test reports (including skips)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.os }}-go${{ matrix.go }}
          path: |
            artifacts/*.jsonl
            artifacts/coverage.out
            artifacts/nssm/
            artifacts/systemd/
          if-no-files-found: warn
          retention-days: 14

  cross-build:
    name: Build only (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
      - name: Cross compile (no runtime verification)
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p artifacts
          go mod download
          go mod verify
          suffix=''; [[ "$GOOS" != windows ]] || suffix='.exe'
          go build -o "artifacts/dircleaner-$GOOS-$GOARCH$suffix" ./cmd/dircleaner

  ci:
    name: CI
    if: always()
    needs: [native, cross-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every matrix job
        env:
          NATIVE: ${{ needs.native.result }}
          CROSS_BUILD: ${{ needs.cross-build.result }}
        run: test "$NATIVE" = success && test "$CROSS_BUILD" = success
